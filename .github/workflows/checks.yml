name: Проверки
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    name: Проверки · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Проверить типы
        run: pnpm check
      - name: Проверить файлы и синхронизацию
        run: pnpm test
      - name: Проверить настольный интерфейс
        run: pnpm test:e2e
      - name: Сохранить отчёт при ошибке
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Ошибка-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/Veltrite-local/playwright-report
            ${{ runner.temp }}/Veltrite-local/test-results
          retention-days: 7
          if-no-files-found: ignore
